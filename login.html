
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYUMAX - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">✦ AYUMAX</div>

        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Login to continue your health journey</p>

        <form id="login-form">

            <div class="auth-input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="auth-input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">Login to AYUMAX →</button>

        </form>

        <p id="login-message"></p>

        <p class="auth-footer">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

        <div class="auth-bottom">✦ SMART HEALTHCARE FOR A HEALTHIER YOU</div>

    </div>

    <script src="login.js"></script>

</body>
</html>
